name: Release FFmpeg runtime

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable R2 prefix, for example ffmpeg-7.0.2-tra.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-ffmpeg-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: win32-x64
            runner: windows-2022
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Unix build tools
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = Linux ]; then sudo apt-get update && sudo apt-get install --yes build-essential curl gpg nasm xz-utils; else brew install nasm; fi
      - name: Set up MSYS2 MINGW64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          install: >-
            base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-nodejs
            nasm curl gnupg xz tar gzip
      - name: Build pinned FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-7.0.2.sh '${{ matrix.target }}' dist
      - name: Build pinned FFmpeg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-ffmpeg-7.0.2.sh '${{ matrix.target }}' dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Verify release tag and artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo 'release_tag must start with a letter or digit and be at most 128 safe characters.' >&2
            exit 1
          fi
          targets=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64)
          payload_files=()
          for target in "${targets[@]}"; do
            payload_files+=(
              "ffmpeg-${target}.gz"
              "${target}.LICENSE"
              "${target}.provenance.json"
              "${target}.version.txt"
              "${target}.buildconf.txt"
              "${target}.license-check.txt"
            )
          done
          test "${#payload_files[@]}" -eq 30
          for payload_file in "${payload_files[@]}"; do test -f "release/${payload_file}"; done
          (cd release && sha256sum "${payload_files[@]}" > SHA256SUMS)
          test "$(wc -l < release/SHA256SUMS)" -eq 30

      - name: Publish verified assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FFMPEG_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FFMPEG_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.FFMPEG_R2_ACCOUNT_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          R2_BUCKET: tra-ffmpeg-runtime
          R2_PUBLIC_BASE_URL: https://ffmpeg.arundelkramer.com
          CACHE_BUST: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo 'release_tag must start with a letter or digit and be at most 128 safe characters.' >&2
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="${RELEASE_TAG}/"
          expected_file="$(mktemp)"
          actual_file="$(mktemp)"
          public_dir="$(mktemp -d)"
          trap 'rm -f "$expected_file" "$actual_file"; rm -rf "$public_dir"' EXIT
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            printf '%s\n' \
              "${prefix}ffmpeg-${target}.gz" \
              "${prefix}${target}.LICENSE" \
              "${prefix}${target}.provenance.json" \
              "${prefix}${target}.version.txt" \
              "${prefix}${target}.buildconf.txt" \
              "${prefix}${target}.license-check.txt"
          done | sort > "$expected_file"
          printf '%s\n' "${prefix}SHA256SUMS" >> "$expected_file"
          sort -o "$expected_file" "$expected_file"
          test "$(wc -l < "$expected_file")" -eq 31
          existing_objects="$(aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "$prefix" \
            --max-keys 1 \
            --endpoint-url "$endpoint" \
            --query 'Contents[0].Key' \
            --output text)"
          if [[ "$existing_objects" != 'None' && -n "$existing_objects" ]]; then
            echo "R2 release prefix already contains objects: $RELEASE_TAG" >&2
            exit 1
          fi
          aws s3 cp release/ "s3://${R2_BUCKET}/${prefix}" \
            --recursive \
            --only-show-errors \
            --endpoint-url "$endpoint"
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "$prefix" \
            --endpoint-url "$endpoint" \
            --query 'Contents[].Key' \
            --output text | tr '\t' '\n' | sed '/^None$/d' | sort > "$actual_file"
          if ! cmp -s "$expected_file" "$actual_file"; then
            echo 'R2 release object names do not match the verified release directory.' >&2
            exit 1
          fi
          curl --fail --location --silent --show-error --header 'Cache-Control: no-cache' \
            --output "$public_dir/SHA256SUMS" \
            "${R2_PUBLIC_BASE_URL}/${RELEASE_TAG}/SHA256SUMS?run=${CACHE_BUST}"
          cmp -s "$public_dir/SHA256SUMS" release/SHA256SUMS
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            for payload_file in \
              "ffmpeg-${target}.gz" \
              "${target}.LICENSE" \
              "${target}.provenance.json" \
              "${target}.version.txt" \
              "${target}.buildconf.txt" \
              "${target}.license-check.txt"; do
              curl --fail --location --silent --show-error --header 'Cache-Control: no-cache' \
                --output "$public_dir/${payload_file}" \
                "${R2_PUBLIC_BASE_URL}/${RELEASE_TAG}/${payload_file}?run=${CACHE_BUST}"
            done
          done
          (cd "$public_dir" && sha256sum -c SHA256SUMS)
