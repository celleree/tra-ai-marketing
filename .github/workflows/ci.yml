name: CI

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    # Superseded PR runs yield to verification of the current revision.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Supervisor model policy and failure tests
        run: python3 -m unittest discover -s scripts/video_review_supervisor -p 'test_*.py' -v
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Offline Chromium regression
        run: npm run test:browser
      - name: Production build
        run: npm run build
