name: Verify direct creative upload

on:
  push:
    branches:
      - feature/direct-creative-upload

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: build-placeholder
      META_ACCESS_TOKEN: build-placeholder
      R2_ACCOUNT_ID: build-placeholder
      R2_ACCESS_KEY_ID: build-placeholder
      R2_SECRET_ACCESS_KEY: build-placeholder
      R2_BUCKET_NAME: build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run verification and record result
        shell: bash
        run: |
          result=success
          npm ci || result=failure
          if [ "$result" = success ]; then npm run typecheck || result=failure; fi
          if [ "$result" = success ]; then npm run build || result=failure; fi
          mkdir -p .verification
          printf '%s\n' "$result" > .verification/direct-upload-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .verification/direct-upload-result.txt
          git commit -m "Record direct upload verification: $result"
          git push
          test "$result" = success
